[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-feasibility-cli"
version = "0.1.0"
description = "Invoke and inspect the AgentCore Claude feasibility runtime"
requires-python = ">=3.11"
dependencies = ["boto3>=1.43.0,<2"]

[project.scripts]
agentcore-feasibility = "agentcore_cli:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["agentcore_cli", "register_identity_api_key"]
