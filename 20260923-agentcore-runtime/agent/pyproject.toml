[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-claude-agent"
version = "0.1.0"
description = "Claude Agent SDK feasibility agent for Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.43.0,<2",
  "bedrock-agentcore>=1.0,<2",
  "claude-agent-sdk>=0.1.0",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
